<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#090d16">
  <title>내 쿠키 잔고 확인 - ClassPay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap');
    * {
      font-family: 'Pretendard', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    html, body {
      height: 100%;
      overflow-x: hidden;
      background-color: #090d16;
    }
    .wallet-gradient { background: linear-gradient(135deg, #0284c7 0%, #2563eb 55%, #4f46e5 100%); }
  </style>
</head>
<body class="text-slate-100 flex flex-col items-center">

  <!-- 알림 토스트 -->
  <div id="toastBanner" class="fixed top-3 left-3 right-3 max-w-md mx-auto z-50 hidden items-center justify-center gap-2 px-4 py-3 rounded-2xl shadow-2xl border text-xs font-black transition-all">
    <span id="toastText">알림</span>
  </div>

  <!-- 스마트폰 풀스크린 래퍼 -->
  <div class="w-full max-w-md min-h-screen bg-slate-950 flex flex-col relative pb-8 shadow-2xl">

    <!-- 상단 헤더 -->
    <header class="sticky top-0 z-30 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-xl wallet-gradient flex items-center justify-center text-white font-black text-sm shadow">
          <i class="fa-solid fa-cookie-bite"></i>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <span class="font-black text-sm text-white tracking-tight">내 쿠키 지갑</span>
            <span id="roomBadgeLabel" class="bg-indigo-950 border border-indigo-500/60 text-sky-300 font-black text-[11px] px-2 py-0.5 rounded-lg">연수학급</span>
          </div>
          <span class="text-[10px] text-slate-400 font-bold block leading-tight">학생 전용 잔고 · 영수증 조회</span>
        </div>
      </div>

      <div class="flex items-center gap-1.5">
        <a href="index.html" class="px-3 py-1.5 rounded-xl bg-indigo-600 active:bg-indigo-500 text-white text-xs font-black flex items-center gap-1.5 shadow">
          <i class="fa-solid fa-chart-line"></i><span>주식장</span>
        </a>
        <button id="logoutBtn" onclick="logoutStudent()" class="hidden px-2.5 py-1.5 rounded-xl bg-slate-800 active:bg-slate-700 text-slate-300 border border-slate-700 text-xs font-bold">
          계좌변경
        </button>
      </div>
    </header>

    <!-- ================= 1. 학생 로그인 화면 ================= -->
    <main id="loginSection" class="flex-1 p-4 flex flex-col justify-center space-y-4">
      <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl space-y-4">
        <div class="text-center space-y-1">
          <div class="w-12 h-12 rounded-2xl bg-indigo-500/20 border border-indigo-500/40 text-indigo-400 flex items-center justify-center mx-auto text-xl mb-2">
            <i class="fa-solid fa-wallet"></i>
          </div>
          <h1 class="text-lg font-black text-white">내 쿠키 잔고 확인하기</h1>
          <p class="text-xs text-slate-400">본인 이름을 선택하고 비밀번호를 입력하세요.</p>
        </div>

        <!-- STEP 1: 학생 이름 버튼 그리드 -->
        <div id="studentNameGrid" class="grid grid-cols-3 gap-2 max-h-72 overflow-y-auto p-0.5"></div>

        <!-- STEP 2: 비밀번호 입력 폼 -->
        <div id="pinInputBox" class="hidden flex-col items-center space-y-3 bg-slate-950 p-4 rounded-2xl border border-indigo-500/40">
          <div class="text-sm font-black text-white">
            <span id="selectedPinStudentName" class="text-amber-300">-</span> 학생 비밀번호
          </div>
          <input type="password" id="studentPinField" inputmode="numeric" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter') confirmLogin()"
            class="w-full bg-slate-900 border-2 border-slate-700 focus:border-indigo-500 rounded-xl px-3 py-2.5 text-center font-mono text-lg text-white outline-none select-text tracking-widest">
          <div class="grid grid-cols-2 gap-2 w-full">
            <button type="button" onclick="cancelPinBox()" class="py-2.5 bg-slate-800 text-slate-300 font-bold rounded-xl text-xs">뒤로</button>
            <button type="button" onclick="confirmLogin()" class="py-2.5 bg-indigo-600 text-white font-black rounded-xl text-xs shadow">확인</button>
          </div>
        </div>
      </div>

      <a href="index.html" class="w-full py-3.5 rounded-2xl bg-slate-900 border border-slate-800 text-indigo-300 font-black text-xs flex items-center justify-center gap-2">
        <i class="fa-solid fa-chart-line"></i><span>주식 거래소(KOSDAQ 클래스)로 이동</span>
      </a>
    </main>

    <!-- ================= 2. 본인 잔고 & 영수증 화면 ================= -->
    <main id="walletSection" class="hidden flex-1 p-4 space-y-4">

      <!-- 내 쿠키 지갑 카드 -->
      <div class="wallet-gradient rounded-3xl p-5 text-white shadow-xl space-y-4">
        <div class="flex items-center justify-between">
          <div>
            <span class="text-[11px] text-sky-200 font-bold block" id="walletRoomTitle">연수학급 쿠키 계좌</span>
            <div class="flex items-baseline gap-1.5 mt-0.5">
              <h2 id="myStudentName" class="text-2xl font-black tracking-tight">-</h2>
              <span class="text-xs text-sky-100 font-bold">학생</span>
            </div>
          </div>
          <button type="button" onclick="toggleMyQrModal()" class="px-3 py-2 rounded-xl bg-white/15 active:bg-white/25 border border-white/30 text-white text-xs font-black flex items-center gap-1.5 shadow">
            <i class="fa-solid fa-qrcode"></i><span>내 QR 보기</span>
          </button>
        </div>

        <div class="bg-slate-950/40 rounded-2xl p-4 border border-white/15">
          <div class="text-[11px] text-sky-200 font-bold">현재 사용 가능한 쿠키 (예수금)</div>
          <div id="myCashDisplay" class="text-3xl font-black font-mono tracking-tight text-amber-300 mt-1">0쿠키</div>
          <div class="grid grid-cols-2 gap-2 mt-3 pt-2.5 border-t border-white/10 text-xs font-mono text-sky-100">
            <div>주식 평가액: <strong id="myStockDisplay" class="text-white">0쿠키</strong></div>
            <div class="text-right">총 자산: <strong id="myTotalDisplay" class="text-white">0쿠키</strong></div>
          </div>
        </div>
      </div>

      <!-- 주식 거래소 바로가기 배너 버튼 -->
      <a href="index.html" class="w-full py-3.5 px-4 rounded-2xl bg-gradient-to-r from-indigo-600 to-violet-600 active:scale-95 text-white font-black text-sm shadow-lg flex items-center justify-between transition-all">
        <span class="flex items-center gap-2">
          <i class="fa-solid fa-chart-line text-amber-300"></i>
          <span>주식 거래소 바로가기</span>
        </span>
        <i class="fa-solid fa-chevron-right text-xs text-indigo-200"></i>
      </a>

      <!-- 본인 입출금 / 결제 영수증 내역 -->
      <div class="bg-slate-900 rounded-3xl p-4 border border-slate-800 space-y-3 shadow-xl">
        <div class="flex items-center justify-between">
          <h3 class="text-xs font-black text-slate-200">
            <i class="fa-solid fa-receipt text-sky-400 mr-1.5"></i>내 쿠키 사용 · 입금 내역
          </h3>
          <span id="logCountBadge" class="text-[10px] text-slate-400 font-bold">0건</span>
        </div>

        <!-- 내역 필터 탭 -->
        <div class="grid grid-cols-3 gap-1.5 bg-slate-950 p-1 rounded-xl border border-slate-800 text-[11px] font-black">
          <button type="button" id="filterBtn_all" onclick="setLogFilter('all')" class="py-1.5 rounded-lg bg-indigo-600 text-white shadow">전체</button>
          <button type="button" id="filterBtn_withdraw" onclick="setLogFilter('withdraw')" class="py-1.5 rounded-lg text-slate-400">쓴 내역 (-)</button>
          <button type="button" id="filterBtn_deposit" onclick="setLogFilter('deposit')" class="py-1.5 rounded-lg text-slate-400">받은 내역 (+)</button>
        </div>

        <div id="myTxList" class="divide-y divide-slate-800/70 max-h-80 overflow-y-auto text-xs"></div>
      </div>

    </main>

  </div>

  <!-- 내 QR 팝업 모달 -->
  <div id="myQrModal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-white text-slate-900 w-full max-w-xs p-6 rounded-3xl shadow-2xl flex flex-col items-center text-center space-y-3">
      <div class="text-xs font-black text-blue-600" id="modalQrRoomTitle">연수학급 쿠키페이 QR</div>
      <h3 class="text-xl font-black text-slate-900" id="modalQrStudentName">-</h3>
      <div id="singleQrBox" class="p-4 bg-white border-4 border-blue-600 rounded-2xl"></div>
      <p class="text-[11px] text-slate-500">매점이나 쿠폰샵 결제 시 점원에게 보여주세요.</p>
      <button type="button" onclick="toggleMyQrModal()" class="w-full py-3 bg-slate-900 text-white font-black rounded-xl text-xs">닫기</button>
    </div>
  </div>

  <script>
    /* =================================================================================
       ★ [연수 선생님 필수 수정 구간] 본인 학급의 Firebase Realtime Database 주소 입력 ★
       ---------------------------------------------------------------------------------
       index.html, pay.html과 동일한 Firebase DB 주소를 입력하세요.
       ================================================================================= */
    const DEFAULT_FIREBASE_DB_URL = "https://my-class-stock-default-rtdb.firebaseio.com/";
    const FIREBASE_ROOT_PATH = "kosdaq_training_room";
    const STORAGE_KEY_MY_WALLET_NAME = "class_stock_cookie_my_name_class_1";

    let roomCustomTitle = "";
    let stocks = [];
    let students = {};
    let payLogs = [];

    let loggedInStudent = "";
    let pendingStudent = "";
    let currentFilter = "all";
    let toastTimer = null;

    function round3(num) {
      return Math.round((Number(num) + Number.EPSILON) * 1000) / 1000;
    }

    function fmtCookie(num) {
      const val = round3(Number(num) || 0);
      return val.toLocaleString('ko-KR', { minimumFractionDigits: 0, maximumFractionDigits: 3 });
    }

    function showToast(msg, type = 'error') {
      const banner = document.getElementById('toastBanner');
      const text = document.getElementById('toastText');
      if (toastTimer) clearTimeout(toastTimer);
      text.textContent = msg;
      banner.className = `fixed top-3 left-3 right-3 max-w-md mx-auto z-50 flex items-center justify-center gap-2 px-4 py-3 rounded-2xl shadow-2xl border text-xs font-black ${
        type === 'error' ? 'bg-rose-950 border-rose-500 text-rose-200' : 'bg-emerald-950 border-emerald-400 text-emerald-100'
      }`;
      toastTimer = setTimeout(() => { banner.classList.add('hidden'); banner.classList.remove('flex'); }, 2400);
    }

    function connectFirebase() {
      if (!firebase.apps.length) {
        firebase.initializeApp({ databaseURL: DEFAULT_FIREBASE_DB_URL });
      }
      const db = firebase.database();
      db.ref(FIREBASE_ROOT_PATH).on('value', (snap) => {
        const data = snap.val();
        if (!data || !data.students) return;

        roomCustomTitle = data.roomCustomTitle || "연수학급";
        stocks = Array.isArray(data.stocks) ? data.stocks : Object.values(data.stocks || {});
        students = data.students || {};
        payLogs = data.payLogs ? Object.values(data.payLogs).sort((a, b) => b.time - a.time) : [];

        document.getElementById('roomBadgeLabel').textContent = roomCustomTitle;
        renderLoginGrid();

        if (loggedInStudent && students[loggedInStudent]) {
          renderWalletDashboard();
        }
      });
    }

    function renderLoginGrid() {
      const grid = document.getElementById('studentNameGrid');
      const names = Object.keys(students);
      grid.innerHTML = names.map(name => `
        <button type="button" onclick="selectStudentForPin('${name}')"
          class="py-3 px-2 rounded-2xl bg-slate-950 hover:bg-indigo-600 active:scale-95 border border-slate-700 text-slate-100 font-black text-xs transition-all truncate">
          ${name}
        </button>
      `).join('');
    }

    function selectStudentForPin(name) {
      pendingStudent = name;
      document.getElementById('selectedPinStudentName').textContent = name;
      document.getElementById('studentPinField').value = "";
      document.getElementById('studentNameGrid').classList.add('hidden');
      const pinBox = document.getElementById('pinInputBox');
      pinBox.classList.remove('hidden');
      pinBox.classList.add('flex');
      setTimeout(() => document.getElementById('studentPinField').focus(), 80);
    }

    function cancelPinBox() {
      pendingStudent = "";
      const pinBox = document.getElementById('pinInputBox');
      pinBox.classList.add('hidden');
      pinBox.classList.remove('flex');
      document.getElementById('studentNameGrid').classList.remove('hidden');
    }

    function confirmLogin() {
      if (!pendingStudent || !students[pendingStudent]) return;
      const inputPin = document.getElementById('studentPinField').value.trim();
      const correctPin = String(students[pendingStudent].pin || "1234");

      if (inputPin === correctPin) {
        loggedInStudent = pendingStudent;
        localStorage.setItem(STORAGE_KEY_MY_WALLET_NAME, loggedInStudent);
        cancelPinBox();
        showWalletScreen();
        showToast(`👋 ${loggedInStudent} 학생, 환영합니다!`, 'success');
      } else {
        showToast("❌ 비밀번호가 일치하지 않습니다!", "error");
        document.getElementById('studentPinField').value = "";
        document.getElementById('studentPinField').focus();
      }
    }

    function showWalletScreen() {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('walletSection').classList.remove('hidden');
      document.getElementById('logoutBtn').classList.remove('hidden');
      renderWalletDashboard();
    }

    function logoutStudent() {
      loggedInStudent = "";
      document.getElementById('walletSection').classList.add('hidden');
      document.getElementById('logoutBtn').classList.add('hidden');
      document.getElementById('loginSection').classList.remove('hidden');
      cancelPinBox();
    }

    function renderWalletDashboard() {
      const sData = students[loggedInStudent];
      if (!sData) return;

      const cash = round3(sData.cash);
      let stockVal = 0;
      if (sData.holdings) {
        Object.entries(sData.holdings).forEach(([code, h]) => {
          const st = stocks.find(x => String(x.code) === String(code));
          if (st && Number(h.qty) > 0) {
            stockVal = round3(stockVal + round3(st.price) * Number(h.qty));
          }
        });
      }

      document.getElementById('walletRoomTitle').textContent = `${roomCustomTitle} 쿠키 계좌`;
      document.getElementById('myStudentName').textContent = loggedInStudent;
      document.getElementById('myCashDisplay').textContent = `${fmtCookie(cash)}쿠키`;
      document.getElementById('myStockDisplay').textContent = `${fmtCookie(stockVal)}쿠키`;
      document.getElementById('myTotalDisplay').textContent = `${fmtCookie(cash + stockVal)}쿠키`;

      renderMyTxList();
    }

    function setLogFilter(mode) {
      currentFilter = mode;
      ['all', 'withdraw', 'deposit'].forEach(k => {
        const btn = document.getElementById(`filterBtn_${k}`);
        if (!btn) return;
        btn.className = (k === mode)
          ? "py-1.5 rounded-lg bg-indigo-600 text-white shadow"
          : "py-1.5 rounded-lg text-slate-400";
      });
      renderMyTxList();
    }

    function renderMyTxList() {
      const container = document.getElementById('myTxList');
      let myLogs = payLogs.filter(l =>
        l.student === loggedInStudent || l.from === loggedInStudent || l.to === loggedInStudent
      );

      if (currentFilter === 'withdraw') {
        myLogs = myLogs.filter(l => l.type === 'withdraw' || l.from === loggedInStudent);
      } else if (currentFilter === 'deposit') {
        myLogs = myLogs.filter(l => l.type === 'deposit' || l.to === loggedInStudent);
      }

      document.getElementById('logCountBadge').textContent = `${myLogs.length}건`;

      if (myLogs.length === 0) {
        container.innerHTML = `<div class="text-center py-6 text-slate-500">표시할 쿠키 내역이 없습니다.</div>`;
        return;
      }

      container.innerHTML = myLogs.slice(0, 30).map(l => {
        const isPlus = (l.type === 'deposit') || (l.to === loggedInStudent);
        const dt = new Date(l.time);
        const timeStr = `${dt.getMonth()+1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
        const remainTxt = l.balanceAfter !== undefined ? ` · 잔액 ${fmtCookie(l.balanceAfter)}쿠키` : '';
        return `
          <div class="py-2.5 flex items-center justify-between">
            <div>
              <div class="font-bold text-slate-200">${l.memo || '쿠키 거래'}</div>
              <div class="text-[10px] text-slate-400 mt-0.5">${timeStr}${remainTxt}</div>
            </div>
            <div class="font-mono font-black text-sm ${isPlus ? 'text-emerald-400' : 'text-rose-400'}">
              ${isPlus ? '+' : '-'}${fmtCookie(l.amount)}쿠키
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleMyQrModal() {
      const modal = document.getElementById('myQrModal');
      if (modal.classList.contains('hidden')) {
        document.getElementById('modalQrRoomTitle').textContent = `[${roomCustomTitle}] 쿠키페이 QR`;
        document.getElementById('modalQrStudentName').textContent = `${loggedInStudent} 학생`;
        const box = document.getElementById('singleQrBox');
        box.innerHTML = "";
        new QRCode(box, {
          text: `1:${loggedInStudent}`,
          width: 190,
          height: 190,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.L
        });
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      } else {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    }

    window.addEventListener('load', () => {
      connectFirebase();
    });
  </script>
</body>
</html>
